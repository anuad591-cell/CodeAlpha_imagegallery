<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
}

header{
    background:#020617;
    padding:25px;
    text-align:center;
    border-bottom:2px solid #334155;
}

header h1{
    font-size:2.5rem;
}

header p{
    color:#94a3b8;
    margin-top:8px;
}

.filters{
    text-align:center;
    margin:25px 0;
}

.filters button{
    background:#1e293b;
    color:white;
    border:none;
    padding:12px 20px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.filters button:hover{
    background:#38bdf8;
    transform:translateY(-2px);
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    padding:20px;
    max-width:1300px;
    margin:auto;
}

.gallery-item{
    overflow:hidden;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.gallery-item img{
    width:100%;
    height:280px;
    object-fit:cover;
    transition:0.5s;
}

.gallery-item:hover img{
    transform:scale(1.1);
}

.lightbox{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.lightbox img{
    max-width:85%;
    max-height:85%;
    border-radius:10px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:45px;
    color:white;
    cursor:pointer;
}

.prev,
.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:50px;
    color:white;
    cursor:pointer;
    user-select:none;
    padding:10px;
}

.prev{
    left:25px;
}

.next{
    right:25px;
}

footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
}

@media(max-width:768px){

    .gallery{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:2rem;
    }

    .lightbox img{
        max-width:95%;
    }

    .prev,
    .next{
        font-size:35px;
    }
}
</style>
</head>
<body>

<header>
    <h1>📸 </h1>
    <p>Responsive  Image Gallery</p>
</header>

<div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
</div>

<div class="gallery">

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/10/800/600"
             alt="Nature"
             onclick="openLightbox(this)">
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1011/800/600"
             alt="City"
             onclick="openLightbox(this)">
    </div>

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/1043/800/600"
             alt="Nature"
             onclick="openLightbox(this)">
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1060/800/600"
             alt="City"
             onclick="openLightbox(this)">
    </div>

</div>

<div class="lightbox" id="lightbox">

    <span class="close" onclick="closeLightbox()">&times;</span>

    <span class="prev" onclick="changeSlide(-1)">❮</span>

    <img id="lightbox-img" alt="Preview">

    <span class="next" onclick="changeSlide(1)">❯</span>

</div>

<footer>
    © 2026 image gallery project 
</footer>

<script>

let currentImages = [];
let currentIndex = 0;

function getVisibleImages(){
    return Array.from(
        document.querySelectorAll(
            '.gallery-item'
        )
    )
    .filter(item => item.style.display !== 'none')
    .map(item => item.querySelector('img'));
}

function openLightbox(clickedImage){

    currentImages = getVisibleImages();

    currentIndex = currentImages.indexOf(clickedImage);

    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src =
    clickedImage.src;
}

function closeLightbox(){
    document.getElementById("lightbox").style.display = "none";
}

function changeSlide(step){

    currentIndex += step;

    if(currentIndex < 0){
        currentIndex = currentImages.length - 1;
    }

    if(currentIndex >= currentImages.length){
        currentIndex = 0;
    }

    document.getElementById("lightbox-img").src =
    currentImages[currentIndex].src;
}

function filterImages(category){

    const items = document.querySelectorAll(".gallery-item");

    items.forEach(item => {

        if(category === "all"){
            item.style.display = "block";
        }
        else if(item.classList.contains(category)){
            item.style.display = "block";
        }
        else{
            item.style.display = "none";
        }

    });
}

document.addEventListener("keydown", function(e){

    if(document.getElementById("lightbox").style.display === "flex"){

        if(e.key === "ArrowRight"){
            changeSlide(1);
        }

        if(e.key === "ArrowLeft"){
            changeSlide(-1);
        }

        if(e.key === "Escape"){
            closeLightbox();
        }
    }
});

</script>

</body>
</html>
